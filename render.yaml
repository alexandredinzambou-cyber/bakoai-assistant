# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free demo setup. Free Postgres expires after 30 days.
services:
  - type: web
    name: bakoai-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: "off"
    envVars:
      - key: APP_NAME
        value: PVIT Assistant
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Laravel requires an artisan-generated base64: key, not a random string.
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: bakoai-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LLM_DEFAULT_PROVIDER
        value: mistral
      - key: LLM_FALLBACK_PROVIDERS
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: open-mistral-nemo
      - key: MISTRAL_VISION_MODEL
        value: ministral-8b-latest
      - key: EMBEDDING_DEFAULT_PROVIDER
        value: nvidia
      - key: EMBEDDING_FALLBACK_PROVIDERS
        value: nvidia
      - key: EMBEDDING_ALLOW_PROVIDER_FALLBACK
        value: "false"
      - key: NVIDIA_EMBEDDING_API_KEY
        sync: false
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/llama-nemotron-embed-vl-1b-v2
      - key: RAG_EMBEDDING_MODEL
        value: nvidia/llama-nemotron-embed-vl-1b-v2
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: RAG_EMBEDDING_DIMENSIONS
        value: "768"
      - key: RAG_TOP_K
        value: "10"
      - key: RAG_MIN_CONFIDENCE
        value: "0.25"
      - key: RAG_LLM_CONFIDENCE_FLOOR
        value: "0.20"
      - key: RAG_EXPOSE_CONFIDENCE
        value: "false"
      - key: RAG_ADMIN_KEY
        generateValue: true

databases:
  - name: bakoai-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: bakoai_assistant
    user: bakoai
